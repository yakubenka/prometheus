services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    env_file: .env
    healthcheck:
      test: ["CMD","python","-c",
        "import os,time; f='/app/logs/prometheus.log'; assert os.path.exists(f) and time.time()-os.path.getmtime(f)<700"]
      interval: 60s
      timeout: 10s
      retries: 3

  api:
    build: .
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    env_file: .env
    healthcheck:
      test: ["CMD","python","-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
